<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- Officina: attrezzi stilizzati (disegno nostro) su fondo caldo, poco contrasto per lasciare leggibili i riquadri -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3EEE5"/>
      <stop offset="1" stop-color="#E6DFD2"/>
    </linearGradient>
    <g id="chiave" fill="none" stroke="#8A7F6E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 112 L92 40"/>
      <path d="M92 40 a24 24 0 1 1 30 -30 l-10 14 a6 6 0 0 0 0 8 l8 8 a6 6 0 0 0 8 0 l14 -10 a24 24 0 0 1 -30 30 z"/>
      <path d="M20 112 a10 10 0 1 0 -14 14 a10 10 0 0 0 14 -14 z" fill="#8A7F6E"/>
    </g>
    <g id="cacciavite" fill="none" stroke="#8A7F6E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 126 L72 68"/>
      <path d="M72 68 L112 28"/>
      <rect x="4" y="106" width="34" height="18" rx="9" transform="rotate(-45 21 115)" fill="#C9553A" stroke="#C9553A"/>
      <path d="M106 22 l12 12"/>
    </g>
    <g id="martello" fill="none" stroke="#8A7F6E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 118 L84 64"/>
      <path d="M70 36 l34 34 l14 -14 a8 8 0 0 0 0 -12 l-22 -22 a8 8 0 0 0 -12 0 z" fill="#8A7F6E"/>
      <path d="M62 44 l-10 -10 a6 6 0 0 1 0 -8 l6 -6" />
    </g>
    <g id="bullone" fill="none" stroke="#8A7F6E" stroke-width="7" stroke-linejoin="round">
      <path d="M60 10 l40 23 v46 l-40 23 l-40 -23 v-46 z"/>
      <circle cx="60" cy="56" r="14"/>
    </g>
    <g id="pinza" fill="none" stroke="#8A7F6E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 124 L60 70"/>
      <path d="M92 124 L60 70"/>
      <path d="M60 70 L48 36 a10 10 0 0 1 8 -14 l6 8 l6 -8 a10 10 0 0 1 8 14 z"/>
      <circle cx="60" cy="70" r="6" fill="#8A7F6E"/>
    </g>
    <g id="metro" fill="none" stroke="#8A7F6E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="16" y="30" width="56" height="56" rx="12" fill="#E9C46A" stroke="#C9A24A"/>
      <path d="M72 64 h44 v18 h-12"/>
      <path d="M86 64 v8 M98 64 v12 M110 64 v8"/>
    </g>
    <pattern id="attrezzi" width="400" height="400" patternUnits="userSpaceOnUse">
      <use href="#chiave" x="30" y="30" opacity=".55"/>
      <use href="#cacciavite" x="230" y="20" opacity=".5" transform="rotate(12 290 90)"/>
      <use href="#martello" x="40" y="230" opacity=".5" transform="rotate(-8 100 300)"/>
      <use href="#bullone" x="250" y="250" opacity=".5"/>
      <use href="#pinza" x="150" y="140" opacity=".45" transform="rotate(20 210 220)"/>
      <use href="#metro" x="300" y="150" opacity=".5" transform="rotate(-14 360 210)"/>
      <use href="#bullone" x="110" y="330" opacity=".35" transform="scale(.6)"/>
    </pattern>
  </defs>
  <rect width="1200" height="1200" fill="url(#fondo)"/>
  <rect width="1200" height="1200" fill="url(#attrezzi)" opacity=".9"/>
</svg>
