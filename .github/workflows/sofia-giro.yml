# Sofia sempre accesa (1.16.0): il giro automatico di Sofia, ogni mezz'ora, anche ad app chiusa.
# Parte da solo quando c'è il segreto FIREBASE_SA (la chiave dell'account di servizio di Firebase, la mette Michele).
# Gli orari sono in UTC (alle :05 e alle :35, dalle 4 alle 21): il giro guarda l'ora di Roma e decide da solo cosa fare.
# 1.17.1: dal tasto «Run workflow», con la casella «prova» spuntata, parte SOLO un avviso di prova sul telefono.
# 1.18.0: ogni 10 minuti (alle :05, :15, :25...): così legge le chat del ponte poco dopo che arrivano (serve GEMINI_CHIAVE).
# 1.18.1: l'orario di GitHub è "quando può" (il 31/10 nessun giro dalle 12:29 alle 17:14): lo fa partire anche il ponte sul PC
# (Run workflow con da = "ponte" e scade = quando scade la sua chiave di GitHub), ogni 10 minuti e dopo i messaggi nuovi.
name: Sofia sempre accesa
on:
  schedule:
    - cron: "5-59/10 4-21 * * *"
  workflow_dispatch:
    inputs:
      prova:
        description: "Solo un avviso di prova sul telefono (niente giro)"
        type: boolean
        default: false
      da:
        description: "Chi lo fa partire (il ponte sul PC scrive: ponte). Lascia vuoto."
        type: string
        default: ""
        required: false
      scade:
        description: "Quando scade la chiave del ponte (la scrive il ponte). Lascia vuoto."
        type: string
        default: ""
        required: false
permissions:
  contents: read
concurrency:
  group: sofia-giro
  cancel-in-progress: false
jobs:
  giro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HA_CHIAVE: ${{ secrets.FIREBASE_SA != '' }}
    steps:
      - name: Manca la chiave
        if: env.HA_CHIAVE != 'true'
        run: echo "Sofia sempre accesa - manca il segreto FIREBASE_SA, il giro non parte."
      - uses: actions/checkout@v4
        if: env.HA_CHIAVE == 'true'
      - uses: actions/setup-node@v4
        if: env.HA_CHIAVE == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sofia-giro/package-lock.json
      - name: Le dipendenze
        if: env.HA_CHIAVE == 'true'
        working-directory: sofia-giro
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Il giro di Sofia
        if: env.HA_CHIAVE == 'true'
        run: node sofia-giro/giro.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          GEMINI_CHIAVE: ${{ secrets.GEMINI_CHIAVE }}
          PROVA_AVVISO: ${{ inputs.prova }}
          GIRO_DA: ${{ inputs.da }}
          GIRO_SCADE: ${{ inputs.scade }}
